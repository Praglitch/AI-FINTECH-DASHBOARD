name: CI

on:
  push:
    branches: [ uat, production ]
  pull_request:
    branches: [ uat, production ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 stocks/ --max-line-length=120 --ignore=E203,W503

      - name: Run tests
        run: python manage.py test
        env:
          DEBUG: True
          DJANGO_SECRET_KEY: dummy
          OPENAI_API_KEY: dummy
          DB_NAME: dummy
          DB_USER: dummy
          DB_PASSWORD: dummy
          DB_HOST: dummy
          DB_PORT: 5432
          ACCORD_DB_NAME: dummy
          ACCORD_DB_USER: dummy
          ACCORD_DB_PASSWORD: dummy
          ACCORD_DB_HOST: dummy
          ACCORD_DB_PORT: 5432
